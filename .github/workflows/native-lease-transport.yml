name: Native lease transport
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  posix-transport:
    name: Synchronous transport (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: 4d7337532bf2e14302a7c73e4a7fa90605456cea
          path: amu
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: amu/package-lock.json
      - run: npm ci
        working-directory: amu
      - name: Actual pipe transport faults without JVM
        working-directory: owner
        env:
          KBB_ENGINE: ../amu/node_modules/nbb/cli.js
        run: node ../amu/bin/kbb --backend sci --config scripts/lease-transport-nbb.edn --classpath src:resources resources/test_native_lease_transport.cljk
# Source-bound signed native guest admission runs downstream in AMU with main locks.
